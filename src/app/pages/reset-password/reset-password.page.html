<ion-content>
  <ion-grid class="reset-grid">
    <ion-row justify-content-center>
      <ion-col size="12" size-md="6" size-lg="4">
        <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
          <ion-card class="reset-card">
            <ion-card-content>
              <ion-card-title>Redefinir Senha</ion-card-title>
              <p class="reset-subtitle">
                Informe seu e-mail cadastrado para receber um link de redefinição.
              </p>

              <ion-item>
                <ion-icon slot="start" name="mail"></ion-icon>
                <ion-input
                  formControlName="email"
                  type="email"
                  placeholder="Digite seu e-mail"
                  aria-label="E-mail para redefinição">
              </ion-input>
              </ion-item>

              <ion-text color="danger" *ngIf="emailControl?.touched && emailControl?.invalid">
                <small *ngIf="emailControl?.errors?.['required']">E-mail é obrigatório.</small>
                <small *ngIf="emailControl?.errors?.['email']">E-mail inválido.</small>
              </ion-text>

              <ion-button
                expand="block"
                shape="round"
                type="submit"
                [disabled]="isLoading || resetForm.invalid">
                {{ isLoading ? 'Enviando...' : 'Enviar e-mail de redefinição' }}
              </ion-button>

              <div class="back-to-login">
                <a [routerLink]="['/login']">Voltar para login</a>
              </div>
            </ion-card-content>
          </ion-card>
        </form>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
